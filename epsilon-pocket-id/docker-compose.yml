version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-pocket-id_caddy_1
      APP_PORT: 8080

  server:
    image: pocketid/pocket-id:v2.14.0@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
    restart: on-failure
    stop_grace_period: 30s
    environment:
      APP_URL: https://${DEVICE_DOMAIN_NAME}:1411
      ENCRYPTION_KEY: ${APP_POCKET_ID_ENCRYPTION_KEY}
      TRUST_PROXY: "true"
      PUID: "1000"
      PGID: "1000"
      ANALYTICS_DISABLED: "true"
    volumes:
      - ${APP_DATA_DIR}/data/pocket-id:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: on-failure
    depends_on:
      server:
        condition: service_healthy
    environment:
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
    ports:
      - "1411:443"
    volumes:
      - ${APP_DATA_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_DATA_DIR}/site:/srv:ro
      - ${APP_DATA_DIR}/data/caddy:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
