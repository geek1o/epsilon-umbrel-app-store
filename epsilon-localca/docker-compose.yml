version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-localca_nginx_1
      APP_PORT: 80

  web:
    image: practicalsre/local-ca:latest@sha256:cedecaae473b6111c866d346bca288490345a5cf15b4da5c3cff50882a5e42dd
    platform: linux/amd64
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: Europe/Moscow
      CSRF_TRUSTED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data/db:/app/db
      - ${APP_DATA_DIR}/data/static:/app/staticfiles
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py initadmin &&
        python manage.py collectstatic --noinput &&
        exec gunicorn localca_project.wsgi --bind 0.0.0.0:8000 --worker-class=gthread --threads=4
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: practicalsre/local-ca-nginx:latest@sha256:dcc30623ca2fc23ac137bd352bab2fc9c6418c2ca3f04e77197fb2699a2e23be
    platform: linux/amd64
    restart: on-failure
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/static:/app/staticfiles:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
