version: "3.7"

services:
  home-assistant-matter-hub:
    image: ghcr.io/riddix/home-assistant-matter-hub:2.0.58@sha256:3b1aa47b49d6f99dac336633f5a3f3ceed7a340b4e9cd4bdd90fbebd0e32db4e
    # Matter uses host networking for mDNS, IPv6, and commissioning. Umbrel
    # LAN ingress serves the manifest port directly, without app_proxy.
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    environment:
      HAMH_HOME_ASSISTANT_URL: http://${DEVICE_DOMAIN_NAME}:8123
      HAMH_HTTP_PORT: "8482"
      HAMH_LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data:/data
