version: "3.7"

services:
  home-assistant-matter-hub:
    image: ghcr.io/riddix/home-assistant-matter-hub:2.0.59@sha256:ef997a84c088ac89e57f9cde0fb6fd18447da0a3c8cc9466c4232ba5a15bd9d7
    # Matter uses host networking for mDNS, IPv6, and commissioning. Umbrel
    # LAN ingress serves the manifest port directly, without app_proxy.
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    environment:
      HAMH_HOME_ASSISTANT_URL: http://${DEVICE_DOMAIN_NAME}:8123
      HAMH_HTTP_PORT: "8482"
      HAMH_LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data:/data
