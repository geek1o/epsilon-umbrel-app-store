version: "3.7"

services:
  home-assistant-matter-hub:
    image: ghcr.io/riddix/home-assistant-matter-hub:2.1.0@sha256:423b77e0467b2a9f1ff21f3c4b4fb0a03aa6a2d0bc47a8d2e3c352ddfed1516b
    # Matter uses host networking for mDNS, IPv6, and commissioning. Umbrel
    # LAN ingress serves the manifest port directly, without app_proxy.
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    environment:
      HAMH_HOME_ASSISTANT_URL: http://${DEVICE_DOMAIN_NAME}:8123
      HAMH_HTTP_PORT: "8482"
      HAMH_LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data:/data
