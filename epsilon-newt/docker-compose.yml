version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-newt_ui_1
      APP_PORT: 8080

  ui:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    restart: on-failure
    user: "1000:1000"
    command: ["python", "/app/app.py"]
    environment:
      PORT: "8080"
      CONFIG_PATH: /config/config.json
      HEALTH_PATH: /status/health
    volumes:
      - ${APP_DATA_DIR}/web:/app:ro
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/status:/status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  newt:
    image: fosrl/newt:1.16.0@sha256:345fdeb369be6608d82c41d70637636c78b2c04a6112ff6ec20fc21c48afc899
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      CONFIG_FILE: /config/config.json
      HEALTH_FILE: /status/health
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/status:/status
    depends_on:
      ui:
        condition: service_healthy
