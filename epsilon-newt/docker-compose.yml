version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-newt_ui_1
      APP_PORT: 8080

  ui:
    image: python:3.13.18-alpine3.24@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    restart: on-failure
    user: "1000:1000"
    command: ["python", "/app/app.py"]
    environment:
      PORT: "8080"
      CONFIG_PATH: /config/config.json
      HEALTH_PATH: /status/health
    volumes:
      - ${APP_DATA_DIR}/web:/app:ro
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/status:/status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docker_socket_proxy:
    image: ghcr.io/linuxserver/socket-proxy:3.4.7-r0-ls105@sha256:823dda971e9a3951257eb251586a804199819fe1587c35faa43adc7b52a2ff16
    restart: on-failure
    read_only: true
    network_mode: none
    entrypoint: ["/bin/sh", "/config/socket-proxy-entrypoint.sh"]
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      LIBPOD_PING: "0"
      LIBPOD_VERSION: "0"
      POST: "0"
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_LOGS: "0"
      ALLOW_TOP: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_DATA_DIR}/data/docker-proxy:/proxy
      - ${APP_DATA_DIR}/socket-proxy-entrypoint.sh:/config/socket-proxy-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /proxy/docker.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  newt:
    image: fosrl/newt:1.20.0@sha256:2170e673c4c72d905764fa22e83d0ae0aa3239fb1ab3b9fcaefb2b00fffb2d6e
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      CONFIG_FILE: /config/config.json
      HEALTH_FILE: /status/health
      DOCKER_SOCKET: unix:///docker-api/docker.sock
      DOCKER_ENFORCE_NETWORK_VALIDATION: "true"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/status:/status
      - ${APP_DATA_DIR}/data/docker-proxy:/docker-api:ro
    depends_on:
      ui:
        condition: service_healthy
      docker_socket_proxy:
        condition: service_healthy
