version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-newt_ui_1
      APP_PORT: 8080

  ui:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    restart: on-failure
    user: "1000:1000"
    command: ["python", "/app/app.py"]
    environment:
      PORT: "8080"
      CONFIG_PATH: /config/config.json
      HEALTH_PATH: /status/health
    volumes:
      - ${APP_DATA_DIR}/web:/app:ro
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/status:/status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docker_socket_proxy:
    image: ghcr.io/linuxserver/socket-proxy:3.4.4-r0-ls97@sha256:ba211325155c463a1a6e6a038c928f21447a8e60ce02ecf41302047974097e84
    restart: on-failure
    read_only: true
    network_mode: none
    entrypoint: ["/bin/sh", "/config/socket-proxy-entrypoint.sh"]
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      LIBPOD_PING: "0"
      LIBPOD_VERSION: "0"
      POST: "0"
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_LOGS: "0"
      ALLOW_TOP: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APP_DATA_DIR}/data/docker-proxy:/proxy
      - ${APP_DATA_DIR}/socket-proxy-entrypoint.sh:/config/socket-proxy-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /proxy/docker.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  newt:
    image: fosrl/newt:1.16.0@sha256:345fdeb369be6608d82c41d70637636c78b2c04a6112ff6ec20fc21c48afc899
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 20s
    environment:
      CONFIG_FILE: /config/config.json
      HEALTH_FILE: /status/health
      DOCKER_SOCKET: unix:///docker-api/docker.sock
      DOCKER_ENFORCE_NETWORK_VALIDATION: "true"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/status:/status
      - ${APP_DATA_DIR}/data/docker-proxy:/docker-api:ro
    depends_on:
      ui:
        condition: service_healthy
      docker_socket_proxy:
        condition: service_healthy
