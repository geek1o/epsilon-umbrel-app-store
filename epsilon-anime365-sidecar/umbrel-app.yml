manifestVersion: 1
id: epsilon-anime365-sidecar
category: media
name: Anime365 Sidecar
version: "0.15.0-ui.6"
tagline: Download your Anime 365 list into Emby or Jellyfin
icon: https://smotret-anime.app/apple-touch-icon.png?v=pgrAWgkp53
description: >-
  Anime365 Sidecar connects an Anime 365 account to Emby or Jellyfin. It follows selected Anime 365 lists, downloads episodes and metadata into a shared library, and synchronizes watched episodes back to Anime 365. Jellyfin support is experimental.


  This Umbrel package uses the official release sidecar container unchanged and adds a separate browser-based configuration panel. The panel covers all upstream environment variables, including watched-episode cleanup, Telegram and proxy settings, checks Anime 365 reachability and media server API access, and reports library statistics.


  ⚠️ An Anime 365 account with an active premium subscription is required. The upstream project is under active development and may change between releases. Downloaded media can require substantial storage space.


  🛠️ SETUP INSTRUCTIONS


  Install and configure Emby or Jellyfin first. Share Umbrel's downloads/anime365 directory with that server and create a TV Shows library. For Epsilon Emby, the library path is /downloads/anime365. Enable real-time monitoring and create an API key. Open Anime365 Sidecar, select your server, enter your Anime 365 credentials and the server API key, Library ID, and User ID, then save. Jellyfin needs a library with exactly one path. Switching an existing library between servers is unsupported. Restart this app from Umbrel after every configuration change because the sidecar reads settings only at startup.


  Umbrel authentication protects the configuration panel. Secrets are stored in the app data directory with restricted file permissions and are never returned to the browser after saving. Media is stored in Umbrel's shared downloads directory for access by the selected media server.
releaseNotes: >-
  Fix delivery of configuration panel files during Umbrel updates. The panel
  is now shipped in a generated root-level template, which Umbrel refreshes
  on every update. Previously the package version could change while the
  installed web directory stayed unchanged. Existing settings and media are
  preserved. The running panel version is visible in the footer.

  The configuration panel now supports all 0.15.0 settings: Emby or Jellyfin,
  watched-episode cleanup policies and cleanup delay. Settings are grouped into
  sections with navigation, contextual help, and light and dark themes.
  Saved Telegram and proxy credentials can be explicitly removed. Existing
  Emby settings and the sidecar image are preserved.

  Release 0.15.0 changed file and directory names, with stricter
  special-character filtering, a 255-character directory limit, and season and
  title-type markers. Upstream recommends deleting previously downloaded episodes
  and downloading them again before upgrading because the naming format changed.

