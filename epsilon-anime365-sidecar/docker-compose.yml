version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-anime365-sidecar_ui_1
      APP_PORT: 8080

  ui:
    image: python:3.13.15-alpine3.24@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    restart: on-failure
    user: "1000:1000"
    command: ["python", "/app/app.py"]
    environment:
      PORT: "8080"
      CONFIG_PATH: /config/.env
      LIBRARY_PATH: /library
      DEFAULT_EMBY_BASE_URL: http://epsilon-emby_server_1:8096/emby
      DEFAULT_EMBY_PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME}:8096
    volumes:
      - ${APP_DATA_DIR}/web:/app:ro
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/anime365:/library:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sidecar:
    image: ghcr.io/flaksp/anime365-sidecar:0.13.1@sha256:ff1c9f7b3e6498f5642bdf626d62da7da1d8032c7fc668b2232a99a5d3164638
    restart: on-failure
    user: "1000:1000"
    working_dir: /config
    depends_on:
      ui:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${UMBREL_ROOT}/data/storage/downloads/anime365:/library
