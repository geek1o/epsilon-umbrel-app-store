version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-anime365-sidecar_ui_1
      APP_PORT: 8080

  ui:
    image: python:3.13.18-alpine3.24@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca
    restart: on-failure
    user: "1000:1000"
    command: ["python", "/app/app.py"]
    environment:
      PORT: "8080"
      CONFIG_PATH: /config/.env
      LIBRARY_PATH: /library
      DEFAULT_EMBY_BASE_URL: http://epsilon-emby_server_1:8096/emby
      DEFAULT_EMBY_PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME}:8098
    volumes:
      - ${APP_DATA_DIR}/web:/app:ro
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads/anime365:/library:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sidecar:
    image: ghcr.io/flaksp/anime365-sidecar:0.14.1@sha256:004874095776e6ff78547164e0ed3cff9cb94b59d5812fabd4da9dd0aee9db9c
    restart: on-failure
    user: "1000:1000"
    working_dir: /config
    tmpfs:
      - /tmp/anime365-sidecar:uid=1000,gid=1000,mode=1777
    depends_on:
      ui:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${UMBREL_ROOT}/data/storage/downloads/anime365:/library
