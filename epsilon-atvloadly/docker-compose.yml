version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-atvloadly_server_1
      APP_PORT: 80

  server:
    image: ghcr.io/bitxeno/atvloadly:v0.8.6@sha256:0caad6e8608804a3159e156e0db5188d261f6b765d903586cd2b3590ee4f0ef0
    restart: on-failure
    stop_grace_period: 30s
    security_opt:
      - seccomp:unconfined
    environment:
      SERVICE_PORT: "80"
      TZ: Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
