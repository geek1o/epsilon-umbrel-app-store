version: "3.7"

services:
  app_proxy:
    depends_on:
      - matterbridge
    environment:
      # Matterbridge requires host networking for Matter and mDNS. Reach its
      # frontend through Docker's host gateway from Umbrel's proxy network.
      APP_HOST: host.docker.internal
      APP_PORT: 8283
    extra_hosts:
      - "host.docker.internal:host-gateway"

  matterbridge:
    image: luligu/matterbridge:latest@sha256:e278cf685f91d6953fb74ed13b7013b514d1417975cf1846599c780bcf551420
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/plugins:/root/Matterbridge
      - ${APP_DATA_DIR}/data/storage:/root/.matterbridge
      - ${APP_DATA_DIR}/data/certificates:/root/.mattercert
