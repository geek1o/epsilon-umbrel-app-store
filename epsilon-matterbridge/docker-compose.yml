version: "3.7"

services:
  matterbridge:
    image: luligu/matterbridge:3.10.12@sha256:da28a7789ca91ceae164c6e3bd18cd36b8e67cd20a423919a27520a7012ef47c
    # Matter commissioning and mDNS require direct host networking. umbrelOS
    # LAN ingress serves the manifest port itself; do not add app_proxy here.
    network_mode: host
    restart: on-failure
    stop_grace_period: 1m
    command: ["matterbridge", "--docker", "--frontend", "8283"]
    volumes:
      - ${APP_DATA_DIR}/data/plugins:/root/Matterbridge
      - ${APP_DATA_DIR}/data/storage:/root/.matterbridge
      - ${APP_DATA_DIR}/data/certificates:/root/.mattercert
