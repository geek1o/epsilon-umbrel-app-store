manifestVersion: 1
id: epsilon-n8n
category: automation
name: n8n
version: "2.39.7-epsilon.1"
tagline: n8n with external task runners and Assistant sandbox
icon: https://raw.githubusercontent.com/n8n-io/n8n/master/packages/@n8n/mcp-browser-extension/icons/icon-128.png
description: >-
  n8n with the official external task runner service and the official n8n
  Assistant sandbox stack. Includes sandbox API, privileged Docker-in-Docker
  runner, and SearXNG JSON web search. This package is an Epsilon-maintained
  alternative to the official n8n Umbrel app. It uses app id epsilon-n8n and
  a separate data directory; back up and import existing n8n data before
  switching. The sandbox runner requires privileged mode because the upstream
  n8n design creates isolated Docker sandboxes; it is never exposed directly
  to the host.
releaseNotes: >-
  First Epsilon build of n8n 2.39.7 with external task runners and the
  official n8n Assistant sandbox provider.
developer: n8n
website: https://n8n.io
repo: https://github.com/n8n-io/n8n
support: https://docs.n8n.io/
port: 5678
gallery: []
path: ""
storage:
  dataRoot: data
environment:
  - name: GENERIC_TIMEZONE
    services:
      - server
    note: IANA time zone used by Schedule nodes, such as Europe/Moscow.
  - name: N8N_WEBHOOK_URL
    services:
      - server
    note: Only set this when n8n is reached through a public HTTPS tunnel or reverse proxy.
defaultUsername: ""
defaultPassword: ""
submitter: GeekIO
submission: https://github.com/geek1o/epsilon-umbrel-app-store
