port: 8370
description: >-
  JellyPlex-Watched syncs watched status and playback progress between Plex, Jellyfin, and Emby. It matches movies and episodes using filenames and provider IDs, and supports multiple servers of each type.


  This Umbrel package adds a Russian-language web panel to the official stable container. Add servers and API tokens, test connectivity, choose sync directions, map user and library names, and set filters and a schedule. Start a run manually or follow its progress in the redacted log. Settings apply to the next run without restarting the app.


  First-run defaults keep the schedule disabled and dry-run enabled. Add at least two servers, check access, save the configuration, and run a dry-run to inspect the proposed changes. When the results match your expectations, turn off dry-run and enable the schedule.


  For Jellyfin and Emby, create an administrator API key in the server dashboard. For Plex, use an administrator X-Plex-Token. Servers may run on the same Umbrel or elsewhere on your network. No specific media server app is required. Do not use localhost as the address of another server.


  For Emby from Epsilon, use http://epsilon-emby_server_1:8096/emby internally, or port 8098 when connecting through the Umbrel host address. Sync directions apply to all servers of the selected types, including same-type syncing when multiple servers are configured.


  Umbrel login protects the panel. Tokens are stored in the app data directory with restricted permissions and are not returned to the browser after saving. This package does not need access to media files or the Docker socket. Matching depends on consistent metadata and filenames; review the dry-run before enabling writes.
