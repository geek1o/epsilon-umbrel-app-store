manifestVersion: 1
id: epsilon-emby
name: Emby
tagline: A personal media server
category: media
version: "latest_fix"
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/emby.svg
port: 8096
description: >-
  Emby turns your Umbrel into a private home media server for movies, TV shows,
  music, photos and personal videos. It scans your files into a polished library,
  downloads artwork and metadata, keeps track of what you have watched, and streams
  your collection to web browsers, phones, tablets, smart TVs and supported media players.


  Multiple users can have separate profiles, playback progress and access controls.
  Emby can also transcode video for devices that cannot play the original format and,
  on supported hardware, use the GPU for hardware-accelerated playback. Live TV and DVR
  are available when Emby is paired with a compatible tuner.


  During first-run setup, create an administrator account and add your media libraries.
  Files stored in Umbrel's Downloads folder are available inside Emby under `/downloads`.
developer: Emby LLC
website: https://emby.media/
submitter: GeekIO
submission: https://github.com/MediaBrowser/Emby
repo: https://github.com/MediaBrowser/Emby
support: https://github.com/MediaBrowser/Emby/issues
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/emby/1.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/emby/2.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/emby/3.jpg
releaseNotes: ""
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
  - GPU
