version: "3.7"

# n8n Assistant sandbox provider for the n8n app (from the official Umbrel App
# Store). Adapted from n8n's official stack definition:
# https://github.com/n8n-io/n8n/blob/master/docker/get-n8n-compose.yml
# See: https://docs.n8n.io/deploy/host-n8n/configure-n8n/set-up-n8n-assistant/
#
# The sandbox service API, runner and sandbox images ship as one release and
# are only supported together, so all three are pinned to the same release.
#
# Cross-app addressing on the Umbrel main network:
#   n8n  ->  sandbox API : http://epsilon-n8n-assistant_sandbox-api_1:8080
#   n8n  ->  web search  : http://epsilon-n8n-assistant_searxng_1:8080

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-n8n-assistant_web_1
      APP_PORT: 8080

  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.4.0@sha256:33d01f44779fba0bc49fa051818ac2f4054c68ead17862543b684ba6a7c3b693
    restart: on-failure
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - ${APP_DATA_DIR}/tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.4.0@sha256:33d01f44779fba0bc49fa051818ac2f4054c68ead17862543b684ba6a7c3b693
    restart: on-failure
    depends_on:
      - sandbox-certs
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
      # Secrets shared with the runner and with n8n. The values are fixed for
      # this install; the n8n-facing key is shown on this app's status page.
      SANDBOX_API_KEYS: 9546cf40f33b0153607d4a806086981447c09f1cef8a3f23
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: 3a5ecae8c24580fee12c5d08289330cf5808af50606dedee
      SANDBOX_API_RUNNER_API_KEY: 6d9e6667ce85e484f0b967d2ace97fb7d9c821e03fbd2756
    volumes:
      - ${APP_DATA_DIR}/tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Never publish 8080/9090 to the host or the internet.
    # n8n reaches this container by its Umbrel main-network name.

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.4.0@sha256:ccb9b68e70d845bf8ee87083e51732e8eb898558110c541751ea7995a66128ad
    # Required by the upstream n8n sandbox design: Docker-in-Docker.
    privileged: true
    restart: on-failure
    depends_on:
      - sandbox-api
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.4.0@sha256:78be9ecdbf644add3f6fb3b5a5b7d889ee533f74ea6b435c0144a1ff1b867883
      SANDBOX_RUNNER_REGISTRATION_TOKEN: 3a5ecae8c24580fee12c5d08289330cf5808af50606dedee
      SANDBOX_RUNNER_API_KEYS: 6d9e6667ce85e484f0b967d2ace97fb7d9c821e03fbd2756
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - ${APP_DATA_DIR}/tls:/tls:ro
    # Never expose this container's ports — it runs privileged Docker-in-Docker.

  searxng:
    image: ghcr.io/searxng/searxng:latest@sha256:f6f67c89efdac7b1bd4805703764ecaa9d0777b86a101b86cae4f1563de4d627
    restart: on-failure
    depends_on:
      - searxng-init
    environment:
      SEARXNG_SECRET: 92192300ef69a4cb744db56240d95e534367415299bbd761
    volumes:
      - ${APP_DATA_DIR}/searxng:/etc/searxng
    # Internal-only: n8n reaches it by its Umbrel main-network name.

  searxng-init:
    image: busybox:1.38.0-musl@sha256:5475de08c557c2c25ffd4a9444e0a1b630e708903792b6c90f6565ef5d0d8c8f
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/searxng:/data
    command:
      - /bin/sh
      - -c
      - >-
        rm -rf /data/settings.yml && printf '%s\n' 'use_default_settings: true' 'search:' '  formats:'
        '    - html' '    - json' > /data/settings.yml

  web:
    image: busybox:1.38.0-musl@sha256:5475de08c557c2c25ffd4a9444e0a1b630e708903792b6c90f6565ef5d0d8c8f
    restart: on-failure
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /www
        cat > /www/index.html <<'HTML'
        <!doctype html><html><head><meta charset="utf-8"><title>n8n Assistant Sandbox</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem;color:#222}pre{background:#f4f4f5;padding:1rem;border-radius:6px;overflow:auto}h1{font-size:1.4rem}</style></head><body>
        <h1>n8n Assistant Sandbox</h1>
        <p>Self-hosted sandbox provider and SearXNG web search for the n8n Assistant.</p>
        <h2>Configure n8n</h2><pre>N8N_INSTANCE_AI_SANDBOX_ENABLED=true
        N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
        N8N_SANDBOX_SERVICE_URL=http://epsilon-n8n-assistant_sandbox-api_1:8080
        N8N_SANDBOX_SERVICE_API_KEY=9546cf40f33b0153607d4a806086981447c09f1cef8a3f23
        N8N_INSTANCE_AI_SEARXNG_URL=http://epsilon-n8n-assistant_searxng_1:8080</pre>
        <p>Проверь sandbox из контейнера n8n: <code>wget -qO- http://epsilon-n8n-assistant_sandbox-api_1:8080/healthz</code></p>
        <p>Добавь ключ Anthropic, OpenAI или OpenRouter в настройках AI внутри n8n.</p></body></html>
        HTML
        exec httpd -f -p 8080 -h /www
