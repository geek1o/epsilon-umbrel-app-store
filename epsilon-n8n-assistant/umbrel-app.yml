manifestVersion: 1
id: epsilon-n8n-assistant
category: automation
name: n8n Assistant Sandbox
version: "1.3.4-1"
tagline: Self-hosted sandbox and web search for the n8n Assistant
icon: https://raw.githubusercontent.com/n8n-io/n8n/master/packages/@n8n/mcp-browser-extension/icons/icon-128.png
description: >-
  This app provides the self-hosted sandbox provider and bundled web search
  (SearXNG) for n8n Assistant, per n8n's official guide "Set up n8n Assistant"
  (Setup 2: Self-host the sandbox manually). It depends on the n8n app from the
  official Umbrel App Store and runs the official n8n sandbox service stack:
  sandbox-certs (one-shot mTLS certificate generator), sandbox-api (the control
  plane n8n talks to) and sandbox-runner-1 (a privileged Docker-in-Docker
  container that creates and runs the isolated code-execution sandboxes), plus
  a bundled SearXNG instance for assistant web search.


  ⚠️ sandbox-runner-1 runs in privileged mode with Docker-in-Docker, as the
  upstream n8n sandbox design requires. It is never exposed to the host or the
  internet; keep this app installed only on trusted instances. This stack is
  intended for local development and testing — n8n recommends the managed
  Daytona provider for production.


  After installing, open this app's page: it shows the health of the sandbox
  services and the exact environment variables to configure in the n8n app
  (sandbox URL, API key and the SearXNG web-search URL). The n8n Assistant
  itself is enabled by adding a model API key (Anthropic, OpenAI or
  OpenRouter) in the n8n editor's AI settings.
releaseNotes: >-
  Initial release of the n8n Assistant sandbox provider (sandbox service
  1.3.4, the release paired with current n8n stable by the official
  get-n8n.sh installer) with bundled SearXNG web search.

