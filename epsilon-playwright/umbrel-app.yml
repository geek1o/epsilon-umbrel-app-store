manifestVersion: 1
id: epsilon-playwright
name: Playwright
version: "0.0.82-4"
tagline: Remote browser automation with Playwright MCP
icon: https://playwright.dev/img/playwright-logo.svg
category: developer
port: 8931
description: >-
  Playwright MCP is Microsoft's official Model Context Protocol server for
  browser automation. It provides an HTTP MCP endpoint backed by headless
  Chromium, with structured accessibility snapshots, navigation, interaction,
  screenshots, network inspection, and browser storage support.


  This package uses the official Playwright MCP container and persists its
  browser profile under the app data directory. The endpoint is exposed through
  Umbrel's reverse proxy; keep it on a trusted network because clients that can
  reach the endpoint can control the browser and access sites opened in it.
  Because the proxy forwards the public host name, the built-in host check is
  disabled, so the endpoint must never be published to the internet.
releaseNotes: >-
  Initial release of Playwright MCP 0.0.82 in the Epsilon store. Fixed the
  "Access is only allowed at localhost:8931" error by allowing the host name
  forwarded by Umbrel's reverse proxy and bypassing the proxy login for MCP
  endpoints (/mcp, /sse).
