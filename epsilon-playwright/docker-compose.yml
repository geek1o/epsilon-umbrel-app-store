version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-playwright_app_1
      APP_PORT: 8931
      # MCP clients speak JSON-RPC over POST /mcp (streamable HTTP) and /sse;
      # they cannot complete Umbrel's browser login, so bypass proxy auth for
      # the MCP endpoints only. Anyone on the network can then drive the
      # browser — keep the device on a trusted network.
      PROXY_AUTH_WHITELIST: "/mcp*,/sse*"

  app:
    image: mcr.microsoft.com/playwright/mcp:v0.0.85@sha256:cc70a6922ff856f3aba0fe97d0d94220dc9a7f367f6d332facc6d81d9a91e60e
    restart: unless-stopped
    init: true
    command:
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --user-data-dir
      - /home/node/.cache/ms-playwright/mcp-profile
      # Umbrel's reverse proxy forwards the public Host header, so the default
      # DNS-rebinding host check (localhost only) rejects every request.
      - --allowed-hosts
      - "*"
    volumes:
      - ${APP_DATA_DIR}/data:/home/node/.cache/ms-playwright/mcp-profile
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8931/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
