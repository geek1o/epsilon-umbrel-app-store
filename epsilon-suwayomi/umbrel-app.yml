id: epsilon-suwayomi
name: Suwayomi
tagline: Read manga - self-hosted server for Mihon/Tachiyomi extensions
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/suwayomi.svg
category: media
version: "2.3.2363"
port: 4567
description: >-
  Suwayomi is a free and open-source manga server that brings Mihon/Tachiyomi
  extensions to the browser. Install source extensions, search their catalogues,
  organise titles into categories, and keep your library on your own Umbrel.

  The built-in reader supports single-page, double-page, continuous and webtoon
  layouts on desktop and mobile. Suwayomi can check for new chapters automatically,
  download them for offline reading, create Mihon-compatible backups, and sync
  progress with services such as MyAnimeList, AniList and MangaUpdates. Compatible
  reader apps can connect through the OPDS catalogue at `/api/opds/v1.2`.

  After installation, open Browse → Extensions to add the sources you use, then
  add titles to your library. No manga or source extensions are bundled. Suwayomi is
  an independent project compatible with Mihon/Tachiyomi; it is not a fork.

