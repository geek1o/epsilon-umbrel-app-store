version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-suwayomi_server_1
      APP_PORT: 4567

  server:
    image: ghcr.io/suwayomi/suwayomi-server:preview@sha256:25376e7c54f0a6d49d861f7fd57dd82e18799aec8928ff0b8fd680c98cd2ff2c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${APP_DATA_DIR}/data:/home/suwayomi/.local/share/Tachidesk
