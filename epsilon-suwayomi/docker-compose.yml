version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-suwayomi_server_1
      APP_PORT: 4567

  server:
    image: ghcr.io/suwayomi/suwayomi-server:preview@sha256:27dd1b51c0497b8ed4ed7c22f8564483990ce04b376cacb73eab419e80022b75
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${APP_DATA_DIR}/data:/home/suwayomi/.local/share/Tachidesk
