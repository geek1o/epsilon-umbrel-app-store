version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: epsilon-suwayomi_server_1
      APP_PORT: 4567

  server:
    image: ghcr.io/suwayomi/suwayomi-server:preview@sha256:ccb0de45fc37c67c46b1a467611eb9f4e8364951b8796cdd796d4a66943c6f8d
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data/downloads:/home/suwayomi/.local/share/Tachidesk/downloads
      - ${APP_DATA_DIR}/data:/home/suwayomi/.local/share/Tachidesk
